# Local Docker: expose API on host port 8000 (no Caddy / HTTPS).
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  api:
    ports:
      - "8000:8000"
    volumes:
      - ./src/app:/financial-rest-api/src/app
    command: ["uv", "run", "fastapi", "dev", "src/app/main.py", "--host", "0.0.0.0", "--port", "8000"]
