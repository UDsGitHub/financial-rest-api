[project]
name = "financial-rest-api"
version = "0.1.0"
description = "A simple financial REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "httpx>=0.28.1",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.0.2",
    "python-dotenv>=1.0.1",
    "redis>=7.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
